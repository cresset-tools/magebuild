[package]
name = "magebuild"
version = "0.19.0" # x-release-please-version
edition = "2024"
rust-version = "1.95"
license = "EUPL-1.2"
authors = ["Jelle Besseling <jelle@pingiun.com>"]
repository = "https://github.com/cresset-tools/magebuild"
description = "Build a Magento release as fast as possible — a parallel, DAG-ordered orchestrator that runs composer install, di-compile, static-content-deploy, autoload dump, and packaging in one process, replacing the build half of a Deployer recipe."

[dependencies]
# Magento engines — git-pinned to cresset-tools/magequery (public repo), linked
# in-process. di-compile: magecommand-engine (scan -> compute_outputs ->
# write_generated); static-content-deploy: magecommand's static_deploy; Magento
# discovery/index and the deploy agent's upgrade checks: magequery-core (its `db` feature adds the
# pure-Rust mysql client).
magequery-core = { git = "https://github.com/cresset-tools/magequery", rev = "cabe1eede86528540f8f646e8702b394f37b6799", features = ["db"] }
magecommand-engine = { git = "https://github.com/cresset-tools/magequery", rev = "cabe1eede86528540f8f646e8702b394f37b6799" }
magecommand = { git = "https://github.com/cresset-tools/magequery", rev = "cabe1eede86528540f8f646e8702b394f37b6799" }

# Composer client — git-pinned to cresset-tools/composer-client, so a fix
# there is usable as soon as it lands, without waiting on a crates.io release.
# composer-install (install-from-lock), composer-autoload (optimized
# dump-autoload), composer-patches (cweagans-style patches).
composer-install = { git = "https://github.com/cresset-tools/composer-client", rev = "4365645661c887281bb21c78dc6261cec209166d" }
composer-autoload = { git = "https://github.com/cresset-tools/composer-client", rev = "4365645661c887281bb21c78dc6261cec209166d" }
composer-patches = { git = "https://github.com/cresset-tools/composer-client", rev = "4365645661c887281bb21c78dc6261cec209166d" }

# CLI + orchestration.
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
tar = "0.4"
flate2 = "1"
# zstd for `.tar.zst` artifacts — faster and denser than gzip. `zstdmt` is
# libzstd's own worker pool, for the files a deploy sends.
zstd = { version = "0.13", features = ["zstdmt"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# deploy agent: flock, kill, getuid; and the agent binary's hash.
libc = "0.2"
sha2 = "0.10"
mimalloc = "0.1"

[dev-dependencies]
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = "symbols"

# The profile cargo-dist builds release binaries with.
[profile.dist]
inherits = "release"
lto = "thin"


