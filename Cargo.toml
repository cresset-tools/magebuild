[package]
name = "magebuild"
version = "0.10.0" # x-release-please-version
edition = "2024"
rust-version = "1.95"
license = "EUPL-1.2"
authors = ["Jelle Besseling <jelle@pingiun.com>"]
repository = "https://github.com/cresset-tools/magebuild"
description = "Build a Magento release as fast as possible — a parallel, DAG-ordered orchestrator that runs composer install, di-compile, static-content-deploy, autoload dump, and packaging in one process, replacing the build half of a Deployer recipe."

[dependencies]
# Magento engines — git-pinned to cresset-tools/magequery (public repo), linked
# in-process. di-compile: magecommand-engine (scan -> compute_outputs ->
# write_generated); static-content-deploy: magecommand's static_deploy; Magento
# discovery/index and `db-status`: magequery-core (its `db` feature adds the
# pure-Rust mysql client).
magequery-core = { git = "https://github.com/cresset-tools/magequery", rev = "01bbd27564ade07fa085852d7156b62214f7e253", features = ["db"] }
magecommand-engine = { git = "https://github.com/cresset-tools/magequery", rev = "01bbd27564ade07fa085852d7156b62214f7e253" }
magecommand = { git = "https://github.com/cresset-tools/magequery", rev = "01bbd27564ade07fa085852d7156b62214f7e253" }

# Composer client — git-pinned to cresset-tools/composer-client, so a fix
# there is usable as soon as it lands, without waiting on a crates.io release.
# composer-install (install-from-lock), composer-autoload (optimized
# dump-autoload), composer-manifest (lockfile model), composer-patches
# (cweagans-style patches).
composer-install = { git = "https://github.com/cresset-tools/composer-client", rev = "16535bccfa29ef6f8b688e307fa9726c699842f9" }
composer-autoload = { git = "https://github.com/cresset-tools/composer-client", rev = "16535bccfa29ef6f8b688e307fa9726c699842f9" }
composer-manifest = { git = "https://github.com/cresset-tools/composer-client", rev = "16535bccfa29ef6f8b688e307fa9726c699842f9" }
composer-patches = { git = "https://github.com/cresset-tools/composer-client", rev = "16535bccfa29ef6f8b688e307fa9726c699842f9" }

# CLI + orchestration.
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
tar = "0.4"
flate2 = "1"
# Parallel gzip for the package step: the tar thread serializes while a worker
# pool compresses blocks concurrently (standard multi-member .tar.gz output).
# default-features off to skip the snappy backend we don't use.
gzp = { version = "0.11", default-features = false, features = ["deflate_default"] }
# zstd for `.tar.zst` artifacts — faster and denser than gzip, with the
# `zstdmt` feature giving libzstd's built-in multi-threaded compression.
zstd = { version = "0.13", features = ["zstdmt"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# deploy agent: flock, kill, getuid; and the agent binary's hash.
libc = "0.2"
sha2 = "0.10"
tracing = "0.1"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = "symbols"

# The profile cargo-dist builds release binaries with.
[profile.dist]
inherits = "release"
lto = "thin"
